name: F0 validation
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    name: validation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate PR source
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:SOURCE_REPOSITORY -ne $env:EXPECTED_REPOSITORY) { throw 'Use an assigned branch in this repository.' }
          if ($env:SOURCE_BRANCH -notin @('dev-manager','dev-a','dev-b','dev-c')) { throw 'Use one of the four fixed development branches.' }
      - name: Shared validation contract
        shell: pwsh
        run: ./scripts/validate.ps1
      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: course-assistant-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
