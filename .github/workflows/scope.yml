name: F0 scope
on:
  workflow_run:
    workflows: [F0 validation]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  scope:
    name: scope-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            // This workflow and policy come from main. Never fetch/run PR code or artifacts here.
            const fs = require('node:fs');
            const policy = JSON.parse(fs.readFileSync('.github/branch-scopes.json', 'utf8'));
            const run = context.payload.workflow_run;
            if (run.event !== 'pull_request') return;
            for (const linked of run.pull_requests) {
              const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: linked.number});
              if (pr.state !== 'open' || pr.head.sha !== linked.head.sha) continue;
              const errors = [];
              if (pr.base.ref !== 'main' || pr.head.repo?.id !== context.payload.repository.id ||
                  !['dev-manager','dev-a','dev-b','dev-c'].includes(pr.head.ref)) {
                errors.push('Use an assigned branch of this repository and target main.');
              }
              const files = await github.paginate(github.rest.pulls.listFiles,
                {...context.repo, pull_number: pr.number, per_page: 100});
              if (files.length !== pr.changed_files) errors.push('Incomplete changed-file list.');
              const allowed = path => pr.head.ref === 'dev-manager'
                ? !policy.managerExcluded.some(prefix => path.startsWith(prefix))
                : (policy.owners[pr.head.ref] ?? []).some(prefix => path.startsWith(prefix));
              for (const file of files) {
                for (const path of [file.filename, file.previous_filename].filter(Boolean)) {
                  if (!allowed(path)) errors.push(`Outside ${pr.head.ref} scope: ${path}`);
                }
              }
              await github.rest.repos.createCommitStatus({...context.repo, sha: pr.head.sha,
                state: errors.length ? 'failure' : 'success', context: 'scope',
                description: errors.length ? 'Write scope rejected; see F0 scope run.' : 'Trusted main policy accepted all changed paths.',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
              if (errors.length) core.setFailed(errors.join('\n'));
            }
